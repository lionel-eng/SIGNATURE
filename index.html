     POURQUOI : servie par script.google.com, la page casse chez les clients qui ont plusieurs comptes Google connectés
       (« Impossible d'ouvrir le fichier », adresse en /u/1/). Hébergée ailleurs, le navigateur n'envoie plus ces comptes.

       (projet HURELLE PORTAIL CLIENT) avec le jeton du lien ; les contrôles (jeton, nom, durée, signature unique) restent côté portail.
     ⚠ UNE SEULE LIGNE À RÉGLER : API = l'adresse …/exec du déploiement du projet HURELLE PORTAIL CLIENT.
     ⚠ Le « moteur » qui remplit les cerfa est le MÊME que celui du bloc « CERFA CESSION » de l'appli et de PortailPage.html :
       un réglage de position doit être refait dans les trois (Claude régénère les trois fichiers ensemble).
     ════════════════════════════════════════════════════════════════════════ -->

        var cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
        return pg.render({ canvasContext:cv.getContext('2d'), viewport:vp }).promise.then(function(){ var u = cv.toDataURL('image/jpeg', 0.85); try { doc.destroy(); } catch (e) {} return u; });
      });
    });
  }
  function fusionner(F){
    var L = PDFLib;
    return L.PDFDocument.create().then(function(out){
      var suite = Promise.resolve(), detail = [];
      function ajouter(f, garder){
        return L.PDFDocument.load(f.bytes).then(function(src){
          var idx = src.getPageIndices(); if (garder) idx = idx.slice(0, garder);
          return out.copyPages(src, idx).then(function(pp){ pp.forEach(function(x){ out.addPage(x); }); return idx.length; });
        });
      }
      F.forEach(function(f){
        suite = suite.then(function(){ return ajouter(f); }).then(function(n){
          if (f.et !== ET){ detail.push(f.lib); return; }
          detail.push(f.lib + ' en 2 exemplaires');
          if (n < 2) return ajouter(f, 1);                                 // modèle de cession d'une seule page : on la met deux fois
        });
      });
      return suite.then(function(){ return out.save(); }).then(function(b){
        return { url:URL.createObjectURL(new Blob([b], { type:'application/pdf' })), pages:out.getPageCount(), detail:detail.join(', '), nom:'CERFA__' + (C ? C.immat : '') + '.pdf' };
      });
    });
  }
  function rogner(cv){
    try {
      var w = cv.width, h = cv.height, d = cv.getContext('2d').getImageData(0, 0, w, h).data, x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 20){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 < 0) return cv;
      var m = 6; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w - 1, x1 + m); y1 = Math.min(h - 1, y1 + m);
      var o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
      o.getContext('2d').drawImage(cv, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
      return o;
    } catch (e) { return cv; }
  }

  // ───────────────────────── ÉCRANS ─────────────────────────
  function page(html, garage){ document.getElementById('pc').innerHTML = '<div class="pc-tete">' + (garage ? '<b>' + E(garage) + '</b> · ' : '') + 'Documents de vente</div>' + html; window.scrollTo(0, 0); }
  function erreur(msg){ page('<div class="pc-alerte">' + E(msg) + '</div>', S.D && S.D.v && S.D.v.nom); }
  var PANNE = 'Service momentanément indisponible. Vérifiez votre connexion et rouvrez le lien reçu par mail.';

  // 1) Le lien est-il valable ?
  function demarrer(){
    if (!JETON){ erreur('Ce lien est incomplet. Ouvrez le lien reçu par mail, en entier.'); return; }
    srv('portailOuvrir', [JETON, '']).then(function(r){ if (!r || !r.ok){ erreur((r && r.message) || PANNE); return; } ecranNom(''); }, function(){ erreur(PANNE); });
  }
  // 2) Nom de famille
  function ecranNom(msg){
    page('<div class="pc-bloc"><h1>Signature de vos documents de vente</h1>'
      + '<p style="margin:0 0 12px;">Pour ouvrir vos documents, tapez votre <b>nom de famille</b> (ou le nom de votre société).</p>'
      + (msg ? '<div class="pc-alerte">' + E(msg) + '</div>' : '')
      + '<input type="text" id="pcNom" autocomplete="family-name" autocapitalize="characters" placeholder="Votre nom de famille">'
      + '<button class="pc-btn" id="pcOuvrir">Ouvrir mes documents</button></div>'
      + '<div class="pc-pied">Ce lien est personnel. Ne le transférez pas.</div>');
    var i = document.getElementById('pcNom'), b = document.getElementById('pcOuvrir');
    function go(){ var n = i.value.trim(); if (n.length < 2){ i.focus(); return; } b.disabled = true; b.textContent = 'Ouverture…'; ouvrir(n); }
    b.onclick = go; i.onkeydown = function(e){ if (e.key === 'Enter') go(); };
  }
  function ouvrir(nom){
    Promise.all([srv('portailOuvrir', [JETON, nom]), lib(LIB.pdflib, function(){ return typeof PDFLib !== 'undefined'; }).then(function(){ return true; }, function(){ return false; })]).then(function(r){
      var d = r[0];
      if (!d || !d.ok){ if (d && d.code === 'NOM') ecranNom(d.message); else erreur((d && d.message) || PANNE); return; }
      S.nom = nom; S.D = d.D || {}; S.vendeur = d.vendeur || ''; S.expireLe = d.expireLe || ''; C.immat = String(S.D.immat || '');
      S.D.a = S.D.a || {}; S.D.v = S.D.v || {};
      MODELES = { cession:deB64(d.modeles.cession), mandat:d.modeles.mandat ? deB64(d.modeles.mandat) : null, demande:d.modeles.demande ? deB64(d.modeles.demande) : null, tampon:d.modeles.tampon ? deB64(d.modeles.tampon) : null };
      S.D.dateVente = aujourdhui(); S.D.heureVente = maintenant();          // provisoire, pour l'aperçu : la vraie date est celle de la signature
      page('<div class="pc-bloc">Préparation de vos documents…</div>', S.D.v.nom);
      if (!r[1]){ S.docs = []; S.images = []; ecranDocuments(); return; }
      remplirTous(S.D, {}).then(function(docs){ S.docs = docs; return images(docs); }).then(function(imgs){ S.images = imgs; ecranDocuments(); }, function(){ S.docs = []; S.images = []; ecranDocuments(); });
    }, function(){ erreur(PANNE); });
  }
  function images(docs){
    var out = [], suite = Promise.resolve();
    docs.forEach(function(d){ suite = suite.then(function(){ return rendreImage(d.bytes, d.page, 1100).then(function(u){ out.push(u); }, function(){ out.push(''); }); }); });
    return suite.then(function(){ return out; });
  }
  // 3) Vérification + signature
  function ecranDocuments(){
    var D = S.D, a = D.a, v = D.v, noms = DOCS.filter(function(d){ return MODELES[d[0]]; }).map(function(d){ return d[2]; });
    var mandat = !!MODELES.mandat, demande = !!MODELES.demande;
    function li(l, val){ return String(val || '').trim() ? '<li><span>' + E(l) + '</span><b>' + E(val) + '</b></li>' : ''; }
    var adr = [a.num, a.ext, a.type, a.voie].filter(function(x){ return String(x || '').trim(); }).join(' ');
    var h = '<div class="pc-bloc"><h1>Bonjour, vérifiez puis signez vos documents</h1>'
      + '<p style="margin:0;">' + noms.length + ' document' + (noms.length > 1 ? 's' : '') + ' : <b>' + noms.map(E).join('</b>, <b>') + '</b>.</p></div>'
      + '<div class="pc-bloc"><h2>Le véhicule</h2><ul class="pc-liste">' + li('Véhicule', [D.marque, D.denom].filter(String).join(' ')) + li('Immatriculation', D.immat) + li('N° de série (VIN)', D.vin)
      + li('1re immatriculation', D.mec) + li('Kilométrage', D.km ? D.km + ' km' : '') + li('Vendu par', v.nom) + '</ul></div>'
      + '<div class="pc-bloc"><h2>Vous (nouveau propriétaire)</h2><ul class="pc-liste">' + li(a.morale ? 'Société' : 'Nom et prénom', a.nom) + (a.morale ? li('SIRET', a.siret) : li('Né(e) le', a.neLe) + li('à', a.neA))
      + li('Adresse', adr) + li('Code postal et commune', [a.cp, a.ville].filter(String).join(' ')) + li('Téléphone', a.tel) + li('Mél', a.email) + '</ul>'
      + '<div class="pc-info" style="margin:12px 0 0;">Une information est fausse ? <b>Ne signez pas</b> et prévenez ' + E(S.vendeur || 'votre vendeur') + ' : les documents seront corrigés et un nouveau lien vous sera envoyé.</div></div>';
    h += '<div class="pc-bloc"><h2>Vos documents</h2>';
    if (S.docs.length) h += S.docs.map(function(d, i){ return '<div style="font-weight:700;">' + E(d.lib) + '</div>' + (S.images[i] ? '<img class="pc-doc" src="' + S.images[i] + '" alt="' + E(d.lib) + '">' : '<div class="pc-note">Aperçu indisponible sur cet appareil : les informations ci-dessus sont celles qui figurent sur ce document.</div>'); }).join('')
      + '<div class="pc-note">Écartez deux doigts sur un document pour l\'agrandir. La date et l\'heure de la cession seront celles de votre signature.</div>';
    else h += '<div class="pc-note">L\'aperçu des documents n\'est pas disponible sur cet appareil. Les informations ci-dessus sont celles qui figurent sur vos documents.</div>';
    h += '</div><div class="pc-bloc"><h2>Votre signature</h2>'
      + '<label class="pc-case"><input type="checkbox" id="pcLu"><span>J\'ai vérifié les informations de ces documents. Je certifie acquérir ce véhicule à la date et à l\'heure de ma signature, en ayant été informé de sa situation administrative'
      + (mandat ? ' ; je donne mandat à ' + E(v.nom) + ' pour effectuer en mon nom les formalités d\'immatriculation, et je sais que je dois assurer ce véhicule avant de circuler' : '')
      + (demande ? ' ; je demande le certificat d\'immatriculation à mon nom' : '') + '.</span></label>'
      + '<label class="pc-case"><input type="checkbox" id="pcOppo"' + (D.opposition ? ' checked' : '') + '><span>Je m\'oppose à la réutilisation de mes données personnelles à des fins de prospection commerciale (facultatif).</span></label>'
      + '<div class="pc-note">Signez dans le cadre, avec le doigt :</div><canvas id="pcPad" class="pc-pad"></canvas>'
      + '<button class="pc-btn clair" id="pcEffacer">Effacer la signature</button>'
      + '<div id="pcMsg"></div><button class="pc-btn" id="pcValider" disabled>Valider ma signature</button></div>'
      + '<div class="pc-pied">Vos informations servent uniquement à établir les documents de vente et d\'immatriculation de ce véhicule. Elles sont conservées par ' + E(v.nom || 'le vendeur') + ' dans le dossier de la vente.'
      + (S.expireLe ? ' Lien valable jusqu\'au ' + E(S.expireLe.replace(' ', ' à ')) + '.' : '') + '</div>';
    page(h, v.nom);
    var cv = document.getElementById('pcPad'), r = cv.getBoundingClientRect(), dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    var cx = cv.getContext('2d'); cx.scale(dpr, dpr); cx.lineWidth = 2.4; cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.strokeStyle = '#10247a';
    var trace = false, long = 0, dernier = null, lu = document.getElementById('pcLu'), bt = document.getElementById('pcValider');
    function pret(){ bt.disabled = !(S.trace && lu.checked) || S.envoi; }
    function pos(e){ var b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; }
    cv.onpointerdown = function(e){ e.preventDefault(); trace = true; dernier = pos(e); try { cv.setPointerCapture(e.pointerId); } catch (x) {} cx.beginPath(); cx.moveTo(dernier[0], dernier[1]); };
    cv.onpointermove = function(e){ if (!trace) return; e.preventDefault(); var p = pos(e); long += Math.abs(p[0] - dernier[0]) + Math.abs(p[1] - dernier[1]); cx.lineTo(p[0], p[1]); cx.stroke(); dernier = p; if (long > 60){ S.trace = true; pret(); } };
    cv.onpointerup = cv.onpointercancel = cv.onpointerleave = function(){ trace = false; };
    document.getElementById('pcEffacer').onclick = function(){ cx.clearRect(0, 0, cv.width, cv.height); long = 0; S.trace = false; pret(); };
    lu.onchange = pret; S.trace = false; S.envoi = false;
    bt.onclick = function(){
      if (!S.trace || !lu.checked || S.envoi) return;
      var png = signaturePng(cv), oppo = document.getElementById('pcOppo').checked, msg = document.getElementById('pcMsg');
      S.envoi = true; bt.disabled = true; bt.textContent = 'Enregistrement de votre signature…'; msg.innerHTML = '';
      srv('portailSigner', [JETON, S.nom, png, oppo]).then(function(res){
        if (!res || !res.ok){
          if (res && (res.code === 'SIGNATURE' || res.code === 'PANNE')){ S.envoi = false; bt.textContent = 'Valider ma signature'; pret(); msg.innerHTML = '<div class="pc-alerte" style="margin:10px 0 0;">' + E(res.message) + '</div>'; }
          else erreur((res && res.message) || PANNE);
          return;
        }
        fini(res, png, oppo);
      }, function(){ S.envoi = false; bt.textContent = 'Valider ma signature'; pret(); msg.innerHTML = '<div class="pc-alerte" style="margin:10px 0 0;">Connexion interrompue : votre signature n\'est pas partie. Appuyez à nouveau sur « Valider ma signature ».</div>'; });
    };
  }
  // La signature, rognée et ramenée à 600 points de large au plus (image PNG en base64, sans l'en-tête)
  function signaturePng(cv){
    var src = rogner(cv), larg = 600, b = '';
    for (var k = 0; k < 4; k++){
      var e = Math.min(1, larg / src.width), o = document.createElement('canvas'); o.width = Math.max(1, Math.round(src.width * e)); o.height = Math.max(1, Math.round(src.height * e));
      o.getContext('2d').drawImage(src, 0, 0, o.width, o.height);
      b = o.toDataURL('image/png').split('base64,')[1] || '';
      if (b.length <= 160000) break; larg = Math.round(larg / 1.6);
    }
    return b;
  }
  // 4) Merci + copie des documents signés (fabriquée dans le téléphone, rien n'est téléchargé depuis le serveur)
  function fini(res, png, oppo){
    var D = S.D, v = D.v;
    var h = '<div class="pc-ok"><h1 style="color:#0d652d;">Merci, vos documents sont signés</h1>Signature enregistrée le <b>' + E(res.date) + '</b> à <b>' + E(res.heure) + '</b>. ' + E(S.vendeur || 'Votre vendeur') + ' est prévenu.</div>'
      + '<div class="pc-bloc" id="pcCopie"><div class="pc-note">Préparation de votre copie…</div></div>'
      + '<div class="pc-pied">Vous pouvez fermer cette page. Ce lien ne peut plus servir.</div>';
    page(h, v.nom);
    function prevenir(b64){ try { srv('portailCopie', [JETON, S.nom, b64 || '']).catch(function(){}); } catch (e) {} }   // mail au vendeur, avec ou sans pièce jointe
    function sans(){ prevenir(''); var z = document.getElementById('pcCopie'); if (z) z.innerHTML = '<div class="pc-note">Votre exemplaire signé vous sera remis par ' + E(S.vendeur || 'votre vendeur') + '.</div>'; }
    if (typeof PDFLib === 'undefined'){ sans(); return; }
    D.dateVente = res.date; D.heureVente = res.heure; D.opposition = !!oppo;
    remplirTous(D, { signature:deB64(png), trace:'Signé à distance le ' + res.date + ' à ' + res.heure + ' par ' + (D.a.nom || '') }).then(function(docs){
      return fusionner(docs);
    }).then(function(t){
      fetch(t.url).then(function(r){ return r.arrayBuffer(); }).then(function(ab){
        var u = new Uint8Array(ab), s = '', pas = 0x8000; for (var i = 0; i < u.length; i += pas) s += String.fromCharCode.apply(null, u.subarray(i, i + pas));
        prevenir(btoa(s));
      }, function(){ prevenir(''); });
      var z = document.getElementById('pcCopie'); if (!z) return;
      z.innerHTML = '<a class="pc-btn" id="pcCopieLien" href="' + t.url + '" download="' + E(t.nom) + '" target="_blank" rel="noopener">Garder une copie de mes documents (' + t.pages + ' pages)</a>'
        + '<div class="pc-note">Certificat de cession, mandat et demande de certificat, signés. ' + E(S.vendeur || 'Votre vendeur') + ' vous remettra aussi votre exemplaire.</div>';
    }).catch(sans);
  }
  window._pcEtat = S;                                                      // pour les essais
  demarrer();
})();
